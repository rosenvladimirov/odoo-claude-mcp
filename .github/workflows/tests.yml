name: Tests (odoo-rpc-mcp)

on:
  push:
    branches: ["2.0", "3.0"]
    paths:
      - "odoo-rpc-mcp/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "odoo-rpc-mcp/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: odoo-rpc-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Same interpreter as the runtime image (odoo-rpc-mcp/Dockerfile).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            odoo-rpc-mcp/requirements.txt
            odoo-rpc-mcp/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run test suite
        # -rs изписва ПРИЧИНАТА за всеки прескочен тест. Прескочено заради
        # липсваща зависимост е дефект на CI-я, не резултат — да се вижда.
        run: pytest tests/ -q --no-header -rs
