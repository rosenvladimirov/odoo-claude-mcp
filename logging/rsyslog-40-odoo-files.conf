# Odoo инстанциите, които пишат във файл (logfile в odoo.conf) → Alloy (127.0.0.1:601) → Loki — 03.10.2026
# Без рестарт на Odoo и без промяна на odoo.conf на клиента. Отделен ruleset: САМО към Alloy,
# не и в /var/log/syslog. freshStartTail — от края на файла, без историята. Traceback-ите се
# сглобяват в едно съобщение: нов запис започва с ред „дата час pid“.
module(load="imfile")

ruleset(name="odoo2loki") {
  action(type="omfwd" target="127.0.0.1" port="601" protocol="tcp"
         template="RSYSLOG_SyslogProtocol23Format" TCP_Framing="octet-counted"
         queue.type="LinkedList" queue.size="50000" action.resumeRetryCount="-1")
}

input(type="imfile" File="/opt/poligroup-v19/log/odoo-server.log" Tag="poligroup-v19-odoo"
      Facility="local0" Severity="info" ruleset="odoo2loki" freshStartTail="on"
      startmsg.regex="^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:,]+ [0-9]+ " readTimeout="2")
