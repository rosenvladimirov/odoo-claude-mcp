# Системните логове на хоста → Alloy (127.0.0.1:601, RFC 5424) → Loki — 03.10.2026
# Опашка в паметта и безкрайни повторни опити: ако Alloy е паднал, rsyslog не спира и не губи.
*.* action(type="omfwd" target="127.0.0.1" port="601" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format" TCP_Framing="octet-counted"
           queue.type="LinkedList" queue.size="20000" action.resumeRetryCount="-1")
